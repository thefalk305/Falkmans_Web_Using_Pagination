<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Photo Album</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="stage" id="stage">
    <div class="book" id="book" aria-label="Family photo album"></div>
  </main>

  <nav class="controls">
    <button id="btnPrev" type="button" aria-label="Previous page">&#8592;</button>
    <span id="pageInfo" aria-live="polite"></span>
    <button id="btnNext" type="button" aria-label="Next page">&#8594;</button>
    <span class="hint">Drag or click a page &middot; &larr; &rarr; keys &middot; click a tab to jump &middot; click a photo to zoom</span>
    <button id="btnCurl" class="pill" type="button" aria-pressed="true" title="Bend pages as they turn">&#8635; Curl on</button>
    <button id="btnSound" class="pill" type="button" aria-pressed="true" title="Page-turn sound">&#9834; Sound on</button>
    <button id="btnEdit" class="pill" type="button" title="Add photos, branches and pages">&#9998; Edit album</button>
  </nav>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lb-bar">
      <button id="lbOut" type="button" aria-label="Zoom out" title="Zoom out (-)">&minus;</button>
      <span id="lbZoomLbl">100%</span>
      <button id="lbIn" type="button" aria-label="Zoom in" title="Zoom in (+)">+</button>
      <button id="lbFit" type="button" class="txt" title="Fit to screen (0)">Fit</button>
      <button id="lbActual" type="button" class="txt" title="Actual size (1)">1:1</button>
      <button id="lbClose" type="button" aria-label="Close" title="Close (Esc)">&#10005;</button>
    </div>
    <button id="lbPrev" class="lb-nav lb-prev" type="button" aria-label="Previous photo">&#8249;</button>
    <button id="lbNext" class="lb-nav lb-next" type="button" aria-label="Next photo">&#8250;</button>
    <img id="lbImg" alt="" draggable="false">
    <p id="lbCap"></p>
    <p class="lb-help">Scroll or pinch to zoom &middot; double-click to zoom in &middot; drag to move</p>
  </div>

  <!-- 1) your content  2) the editor and saved edits  3) the album engine -->
  <script src="album-data.js"></script>
  <script src="editor.js"></script>
  <script src="album.js"></script>
</body>
</html>
